# Lançamento de versão: a cada tag vX.Y.Z, gera o instalador do Windows e publica
# o Release no GitHub. Os sistemas instalados se atualizam por ele
# (Configurações → Atualizações → Verificar e atualizar).
#
#   1. suba o __version__ em src/honorarios/__init__.py e faça o commit
#   2. git tag v1.2.3 && git push origin main v1.2.3
#
# A tag precisa ser igual ao __version__ (com o "v" na frente), senão para aqui.
name: Lançamento

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # criar o Release e anexar o instalador

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # as tags anteriores, para as novidades do Release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: python -m pip install --upgrade pip && python -m pip install -e ".[empacotar]"

      - name: Versão e novidades
        id: versao
        shell: pwsh
        run: |
          $versao = python -c "import honorarios; print(honorarios.__version__)"
          $tag = "${{ github.ref_name }}"
          if ("v$versao" -ne $tag) { throw "A tag $tag não bate com a versão $versao do pacote" }
          "versao=$versao" >> $env:GITHUB_OUTPUT
          # o que mudou desde a versão anterior: um item por commit
          $anterior = git describe --tags --abbrev=0 "$tag^" 2>$null
          $faixa = if ($anterior) { "$anterior..$tag" } else { $tag }
          $itens = git log --no-merges --format="- %s" $faixa
          "## Novidades da versão $versao`n" | Out-File -Encoding utf8 novidades.md
          $itens | Out-File -Encoding utf8 -Append novidades.md

      - name: Programa (PyInstaller)
        run: pyinstaller --noconfirm --clean instalador/financeiro_metodos.spec

      - name: Instalador (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Não consegui instalar o Inno Setup" }
          }
          & $iscc "/DVersao=${{ steps.versao.outputs.versao }}" instalador\financeiro_metodos.iss
          if ($LASTEXITCODE -ne 0) { throw "O Inno Setup falhou" }

      - name: Publicar o Release
        uses: softprops/action-gh-release@v2
        with:
          name: Financeiro Métodos ${{ steps.versao.outputs.versao }}
          body_path: novidades.md
          files: instalador/saida/Instalador_Financeiro_Metodos_${{ steps.versao.outputs.versao }}.exe
          fail_on_unmatched_files: true
